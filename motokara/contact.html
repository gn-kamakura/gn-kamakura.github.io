<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ ― MOTOKARA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='32%25' cy='28%25' r='75%25'%3E%3Cstop offset='0%25' stop-color='%23FFF6E4'/%3E%3Cstop offset='45%25' stop-color='%23F6C876'/%3E%3Cstop offset='100%25' stop-color='%23F3A98C'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;900&display=swap');
  :root{
    --paper:#FAF6EC; --paper-deep:#F0E9D6; --card:#FFFFFF;
    --ink:#3A362C; --ink-soft:#8A8371;
    --leaf:#4F7942; --coral:#E8896B; --coral-light:#FBE4DA;
    --sun-soft:#F6C876; --coral-soft:#F3A98C;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'M PLUS Rounded 1c', sans-serif; line-height:1.8; }
  .wrap{ max-width:560px; margin:0 auto; padding:32px 20px 80px; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .mark{ width:32px;height:32px; border-radius:50%; background:radial-gradient(circle at 32% 28%, #FFF6E4, var(--sun-soft) 45%, var(--coral-soft) 100%); }
  .brand-name{ font-weight:900; font-size:15px; }
  .back-link{ font-size:12px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-size:20px; font-weight:900; margin-bottom:8px; }
  .lead{ font-size:13px; line-height:1.9; color:var(--ink-soft); margin-bottom:28px; }
  .card{ background:var(--card); border-radius:var(--radius); padding:24px 22px; box-shadow:0 6px 20px rgba(58,54,44,0.06); }

  .form-group{ margin-bottom:18px; }
  .form-group:last-of-type{ margin-bottom:0; }
  label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  label .opt{ color:var(--ink-soft); font-weight:400; font-size:11px; margin-left:4px; }
  input, textarea{
    width:100%; background:var(--paper); border:1.5px solid var(--paper-deep); border-radius:12px;
    padding:12px 14px; font-family:'M PLUS Rounded 1c', sans-serif; font-size:16px; color:var(--ink);
    outline:none; transition:border-color .2s ease;
  }
  input:focus, textarea:focus{ border-color:var(--coral); }
  textarea{ min-height:130px; resize:vertical; line-height:1.8; }

  button.submit-btn{
    width:100%; appearance:none; border:none; background:var(--coral); color:#fff;
    font-family:'M PLUS Rounded 1c', sans-serif; font-size:14px; font-weight:700; letter-spacing:.02em;
    padding:15px; border-radius:var(--radius); cursor:pointer; margin-top:24px;
    transition:transform .15s ease, background .2s ease;
  }
  button.submit-btn:hover:not(:disabled){ background:#DD7856; transform:translateY(-1px); }
  button.submit-btn:disabled{ opacity:.5; cursor:default; }

  .form-note{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:12px; }

  .status-msg{ display:none; font-size:12.5px; line-height:1.85; padding:14px 16px; border-radius:12px; margin-top:16px; }
  .status-msg.show{ display:block; }
  .status-msg.success{ background:var(--leaf); background:rgba(79,121,66,0.1); border:1px solid rgba(79,121,66,0.35); color:var(--leaf); }
  .status-msg.error{ background:var(--coral-light); border:1px solid rgba(232,137,107,0.4); color:var(--coral); }

  .contact-alt{ margin-top:22px; text-align:center; font-size:12px; color:var(--ink-soft); }
  a{ color:var(--coral); }
  footer{ margin-top:40px; font-size:11px; color:var(--ink-soft); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark"></div><span class="brand-name">MOTOKARA</span></div>
    <a href="./index.html" class="back-link">← トップに戻る</a>
  </header>

  <h1>お問い合わせ</h1>
  <p class="lead">ご質問・ご要望・不具合のご報告など、お気軽にご連絡ください。通常2営業日以内にご返信いたします。</p>

  <div class="card">
    <form id="contactForm" action="https://formspree.io/f/mkodjjon" method="POST">
      <input type="hidden" name="_subject" value="【MOTOKARA】お問い合わせ">
      <div class="form-group">
        <label for="name">お名前<span class="opt">任意</span></label>
        <input type="text" id="name" name="name" placeholder="山田 太郎">
      </div>
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" required placeholder="お問い合わせ内容をご記入ください"></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">送信する</button>
      <p class="form-note">送信いただいた内容は、お問い合わせ対応の目的以外には使用しません。</p>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <p class="contact-alt">フォームがうまく送信できない場合は、<a href="mailto:info@gn-kamakura.com">info@gn-kamakura.com</a> まで直接ご連絡ください。</p>

  <footer>© 2026 グッドネイバーカマクラ合同会社</footer>
</div>

<script>
  const form = document.getElementById('contactForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '送信しています…';
    statusMsg.className = 'status-msg';

    const fd = new FormData(form);

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: fd
      });
      if (res.ok) {
        statusMsg.textContent = 'お問い合わせを送信しました。ありがとうございます。';
        statusMsg.classList.add('show', 'success');

        fetch('https://idjbnrohrthqsabqmfjk.supabase.co/functions/v1/log-inquiry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            service: 'MOTOKARA',
            name: fd.get('name'),
            email: fd.get('email'),
            message: fd.get('message')
          })
        }).catch(() => {});

        form.reset();
        submitBtn.textContent = '送信しました';
      } else {
        throw new Error('送信に失敗しました');
      }
    } catch (err) {
      statusMsg.textContent = '送信に失敗しました。お手数ですが info@gn-kamakura.com まで直接ご連絡ください。';
      statusMsg.classList.add('show', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = '送信する';
    }
  });
</script>

</body>
</html>
