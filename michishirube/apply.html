<style>
  :root{
    --ink:#0B1F3A; --muted:#5B6B85; --paper:#F3F6FB; --panel:#FFFFFF; --line:#DCE3EE;
    --blue:#0057FB; --cyan:#00A7FD; --teal:#14E0B8; --amber:#F2994A;
    --grad: linear-gradient(100deg, var(--blue) 0%, var(--cyan) 55%, var(--teal) 100%);
    --font-display:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    --font-body:'Noto Sans JP', 'Hiragino Sans', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); line-height:1.8; font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}
  a{color:inherit;}
  .wrap{max-width:640px; margin:0 auto; padding:0 24px;}

  header{ border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; padding:14px 28px; max-width:1080px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:9px; text-decoration:none; }
  .brand img{ width:30px; height:30px; }
  .brand span{ font-family:var(--font-body); font-weight:700; font-size:18px; color:var(--ink); }

  main{ padding:56px 0 80px; }
  .head{ text-align:center; margin-bottom:36px; }
  h1{ font-family:var(--font-display); font-weight:900; font-size:28px; margin:0 0 14px; line-height:1.4; }
  .lede{ color:var(--muted); font-size:15px; max-width:420px; margin:0 auto; line-height:1.9; }

  .reassure{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:36px;
  }
  .reassure div{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; text-align:center; font-size:12.5px; font-weight:700; color:var(--muted);
  }
  .reassure div b{ display:block; font-size:15px; color:var(--ink); margin-bottom:2px; }

  form{
    background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:32px;
    box-shadow:0 16px 40px rgba(11,31,58,.06);
  }
  .field{ margin-bottom:20px; }
  label{ display:block; font-size:13.5px; font-weight:700; margin-bottom:7px; }
  label .opt{ font-weight:400; color:var(--muted); font-size:12px; }
  input, textarea{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px;
    font-family:var(--font-body); font-size:14.5px; color:var(--ink); background:var(--paper);
  }
  input:focus, textarea:focus{ outline:none; border-color:var(--blue); }
  textarea{ resize:vertical; min-height:90px; }

  .submit-btn{
    width:100%; background:var(--grad); color:#fff; font-weight:700; font-size:15.5px;
    padding:15px 22px; border-radius:999px; border:none; cursor:pointer; font-family:var(--font-body);
    box-shadow:0 6px 18px rgba(0,87,251,.25);
  }
  .submit-btn:hover{ filter:brightness(1.06); }
  .form-note{ font-size:12px; color:var(--muted); text-align:center; margin-top:16px; }
  .privacy-note{ font-size:12px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.8; }
  .privacy-note a{ color:var(--blue); }
  .success-msg{ display:none; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:32px; text-align:center; box-shadow:0 16px 40px rgba(11,31,58,.06); }
  .success-msg.show{ display:block; }
  .success-msg h3{ font-family:var(--font-display); font-size:18px; font-weight:900; margin-bottom:10px; color:var(--blue); }
  .success-msg p{ font-size:13.5px; color:var(--muted); line-height:1.9; }

  .back-link{ display:block; text-align:center; margin-top:28px; font-size:13.5px; color:var(--muted); text-decoration:underline; }

  footer{ padding:36px 0 48px; border-top:1px solid var(--line); }
  .foot-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; max-width:1080px; margin:0 auto; padding:0 28px; }
  .foot-brand{ display:flex; align-items:center; gap:9px; }
  .foot-brand img{ width:22px; height:22px; }
  .foot-brand span{ font-family:var(--font-body); font-weight:700; font-size:15px; }
  .foot-meta{ font-size:12.5px; color:var(--muted); }
  .foot-meta a{ white-space:nowrap; }
  .foot-links{ display:inline; margin-left:12px; }
  .foot-links a{ margin-right:16px; }
  .foot-links a:last-child{ margin-right:0; }
  @media (max-width:640px){
    .foot-row{ flex-direction:column; text-align:center; gap:8px; }
    .foot-meta{ line-height:1.6; }
    .foot-links{ display:flex; flex-direction:row; flex-wrap:nowrap; justify-content:center; gap:8px; margin-top:6px; font-size:10.5px; }
    .foot-links a{ margin-right:8px; }
    .foot-links a:last-child{ margin-right:0; }
  }

  @media (max-width:600px){
    .reassure{ grid-template-columns:1fr; }
  }
</style>
</head>

<main>
  <div class="wrap">
    <div class="head">
      <h1>無料セットアップ相談に<br>申し込む</h1>
      <p class="lede">30分、オンラインで同席しながら<br>設定をサポートします。<br>そのまま診断のご相談も承ります。</p>
    </div>

    <form id="apply-form" action="https://formspree.io/f/xnpaokjl" method="POST">
      <div class="field">
        <label for="shop">店舗名</label>
        <input type="text" id="shop" name="shop" required>
      </div>
      <div class="field">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="tel">電話番号<span class="opt">(任意)</span></label>
        <input type="tel" id="tel" name="tel">
      </div>
      <div class="field">
        <label for="time">希望日時<span class="opt">(任意、第3希望まで)</span></label>
        <input type="text" id="time" name="time" placeholder="例: 8月25日(火)14時〜、8月26日(水)終日可、8月27日(木)午前中">
      </div>
      <div class="field">
        <label for="message">ご質問・ご要望<span class="opt">(任意)</span></label>
        <textarea id="message" name="message"></textarea>
      </div>
      <input type="hidden" name="_subject" value="【ミチシルベ】無料セットアップ相談の申し込み">
      <input type="hidden" name="_replyto" value="info@gn-kamakura.com">
      <button type="submit" class="submit-btn" id="submitBtn">この内容で申し込む</button>
      <p class="privacy-note">送信内容は<a href="privacy.html">プライバシーポリシー</a>に従って取り扱います。</p>
    </form>
    <div class="success-msg" id="successMsg">
      <h3>お申し込みを受け付けました</h3>
      <p>ご連絡ありがとうございます。<br>通常2営業日以内にご返信いたします。<br>しばらくお待ちください。</p>
    </div>

    <a class="back-link" href="index.html">トップページに戻る</a>
  </div>
</main>

<script>
document.getElementById('apply-form').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '送信中...';
  var fd = new FormData(this);
  try {
    var res = await fetch(this.action, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
    if (res.ok) {
      this.style.display = 'none';
      document.getElementById('successMsg').classList.add('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Notionのお問い合わせ管理データベースにも記録(失敗しても送信自体は成功扱い)
      var detail = [
        '店舗名: ' + fd.get('shop'),
        '電話番号: ' + (fd.get('tel') || '(未記入)'),
        '希望日時: ' + (fd.get('time') || '(未記入)'),
        'ご質問: ' + (fd.get('message') || '(なし)')
      ].join('\n');
      fetch('https://idjbnrohrthqsabqmfjk.supabase.co/functions/v1/log-inquiry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service: 'ミチシルベ',
          name: fd.get('name'),
          email: fd.get('email'),
          message: detail
        })
      }).catch(function(){});
    } else {
      throw new Error();
    }
  } catch (err) {
    btn.disabled = false; btn.textContent = 'この内容で申し込む';
    alert('送信に失敗しました。恐れ入りますが info@gn-kamakura.com までご連絡ください。');
  }
});
</script>
