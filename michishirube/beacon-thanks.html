<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お申し込みありがとうございます | ミチシルベ Beacon</title>
<meta name="robots" content="noindex">

<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=optional" rel="stylesheet">

<style>
  :root{
    --ink:#0B1F3A; --muted:#5B6B85; --paper:#F3F6FB; --panel:#FFFFFF; --line:#DCE3EE;
    --blue:#0057FB; --cyan:#00A7FD; --teal:#14E0B8; --amber:#F2994A;
    --grad: linear-gradient(100deg, var(--blue) 0%, var(--cyan) 55%, var(--teal) 100%);
    --font-display:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    --font-body:'Noto Sans JP', 'Hiragino Sans', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink); min-height:100vh;
    font-family:var(--font-body); line-height:1.8; font-size:16px;
    display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .card{
    max-width:520px; width:100%; background:var(--panel); border:1.5px solid var(--line);
    border-radius:20px; padding:40px 34px; text-align:center; box-shadow:0 10px 30px rgba(11,31,58,.06);
  }
  .badge{
    display:inline-block; font-family:var(--font-mono); font-size:12px; font-weight:700;
    color:#fff; background:var(--grad); padding:5px 14px; border-radius:999px; margin-bottom:18px;
  }
  h1{ font-family:var(--font-display); font-size:22px; margin:0 0 14px; }
  p{ color:var(--muted); font-size:14.5px; margin:0 0 12px; }
  .steps{ text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px 22px; margin:22px 0; font-size:13.5px; }
  .steps li{ margin:6px 0; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; margin-top:10px;
    background:var(--grad); color:#fff; font-weight:700; font-size:14px;
    padding:12px 22px; border-radius:999px; text-decoration:none; font-family:var(--font-body);
  }
  .foot{ margin-top:22px; font-size:12px; color:var(--muted); }
  .foot a{ color:var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">ミチシルベ Beacon</span>
    <h1>お申し込み、ありがとうございます</h1>
    <p>お支払いが完了しました。近隣競合比較レポート（PDF）を、ご登録のメールアドレス宛にお送りします。</p>
    <ul class="steps">
      <li>通常1営業日以内にお届けします</li>
      <li>店名・住所の確認等でご連絡する場合があります</li>
      <li>迷惑メールフォルダもあわせてご確認ください</li>
    </ul>
    <p>お急ぎの場合や、気になる競合店のご指定（最大3件）がまだの場合は、決済時の備考欄またはメールにてお知らせください。</p>
    <p class="foot">ご不明な点がございましたら、<br>恐れ入りますが <a href="mailto:info@gn-kamakura.com">info@gn-kamakura.com</a><br>までご連絡ください。</p>
    <div class="foot">
      <a href="index.html">ミチシルベ トップに戻る</a>
    </div>
  </div>
</body>
</html>
