<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ ― ぱたん</title>
<link rel="canonical" href="https://www.gn-kamakura.com/patan/contact.html">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <a class="brand" href="./">
      <svg width="22" height="30" viewBox="0 0 80 112" aria-hidden="true"><rect x="6" y="4" width="68" height="104" rx="10" fill="none" stroke="#15251E" stroke-width="7"/><line x1="6" y1="38" x2="74" y2="38" stroke="#15251E" stroke-width="7"/><line x1="58" y1="54" x2="58" y2="76" stroke="#15251E" stroke-width="7" stroke-linecap="round"/></svg>
      <span class="brand-name">ぱたん</span>
    </a>
    <a class="back-link" href="./">← トップに戻る</a>
  </header>

  <main class="doc">
    <h1>お問い合わせ</h1>
    <p class="updated">ご質問、ご要望、不具合のご報告など、お気軽にご連絡ください。通常2営業日以内にご返信します。</p>

    <form id="contactForm" class="form" action="https://formspree.io/f/mkodjjon" method="POST">
      <input type="hidden" name="_subject" value="【ぱたん】お問い合わせ">
      <div class="field">
        <label for="name">お名前<span class="opt">任意</span></label>
        <input type="text" id="name" name="name" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn" id="submitBtn">送信する</button>
      <div class="status" id="statusMsg" role="status"></div>
    </form>
    <p class="alt">送信いただいた内容は、お問い合わせへの対応以外には使用しません。フォームがうまく送信できない場合は、<a href="mailto:info@gn-kamakura.com">info@gn-kamakura.com</a> まで直接ご連絡ください。</p>
  </main>

  <footer class="site-foot">
    <nav class="foot-links" aria-label="フッター">
      <a href="./about.html">運営者情報</a>
      <a href="./privacy.html">プライバシーポリシー</a>
      <a href="./contact.html">お問い合わせ</a>
    </nav>
    <p>© グッドネイバーカマクラ合同会社</p>
  </footer>

</div>

<script>
  const form = document.getElementById('contactForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '送信しています…';
    statusMsg.className = 'status';

    const fd = new FormData(form);

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: fd
      });
      if (!res.ok) throw new Error('send failed');

      statusMsg.textContent = 'お問い合わせを送信しました。ありがとうございます。';
      statusMsg.classList.add('show', 'ok');

      // お問い合わせ管理への記録（失敗しても送信自体は成功扱い）
      fetch('https://idjbnrohrthqsabqmfjk.supabase.co/functions/v1/log-inquiry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service: 'ぱたん',
          name: fd.get('name'),
          email: fd.get('email'),
          message: fd.get('message')
        })
      }).catch(() => {});

      form.reset();
      submitBtn.textContent = '送信しました';
    } catch (err) {
      statusMsg.textContent = '送信に失敗しました。お手数ですが、info@gn-kamakura.com まで直接ご連絡ください。';
      statusMsg.classList.add('show', 'ng');
      submitBtn.disabled = false;
      submitBtn.textContent = '送信する';
    }
  });
</script>

</body>
</html>
